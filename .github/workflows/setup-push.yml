name: 🔔 Pushmeldingen inrichten

# Draait alleen als cf-worker/.setup-push wordt aangeraakt, of handmatig.
# Zo kan hij niet per ongeluk opnieuw afgaan: een tweede run maakt nieuwe
# VAPID-sleutels, en daarmee zijn alle bestaande abonnementen ongeldig.
on:
  push:
    branches: [main]
    paths: ['cf-worker/.setup-push']
  workflow_dispatch:

jobs:
  inrichten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔍 Wat mag dit token eigenlijk?
        working-directory: cf-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 whoami 2>&1 | tail -30
          # Welk van de twee tokens in het dashboard is dit? De id hieronder
          # staat in de URL als je dat token daar aanklikt.
          code=$(curl -s -o /tmp/tok.json -w "%{http_code}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          id=$(node -e "const fs=require('fs');let r='onbekend';try{r=JSON.parse(fs.readFileSync('/tmp/tok.json','utf8')).result.id}catch(e){};console.log(r)")
          echo "::notice title=Token in gebruik::id=$id (http $code)"

      - name: 🗄️ KV-namespace aanmaken of hergebruiken
        id: kv
        continue-on-error: true
        working-directory: cf-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          # Bestaat hij al? Dan die id gebruiken, anders klaagt 'create'.
          npx --yes wrangler@4 kv namespace list > lijst.json 2>/dev/null || echo '[]' > lijst.json
          # Wrangler drukt een banner boven de JSON; knip die eerst weg.
          ID=$(node -e "
            const t=require('fs').readFileSync('lijst.json','utf8');
            const a=t.indexOf('['), b=t.lastIndexOf(']');
            let l=[]; if(a!==-1&&b>a){ try{ l=JSON.parse(t.slice(a,b+1)) }catch{} }
            const n=l.find(x=>/(^|-)SUBS\$/.test(x.title||''));
            if(n) console.log(n.id);
          ")
          if [ -z "$ID" ]; then
            echo 'Nieuwe namespace aanmaken…'
            npx --yes wrangler@4 kv namespace create SUBS | tee uit.txt
            ID=$(grep -oE '"?id"?[[:space:]]*[:=][[:space:]]*"?[0-9a-f]{32}' uit.txt | grep -oE '[0-9a-f]{32}' | head -1)
          else
            echo 'Bestaande namespace hergebruikt.'
          fi
          if [ -z "$ID" ]; then echo '::error::geen namespace-id gevonden'; exit 1; fi
          echo "KV_ID=$ID" >> "$GITHUB_OUTPUT"
          echo "::notice title=KV-namespace::SUBS = $ID"

      - name: 🔑 VAPID-sleutels maken en als secret zetten
        id: vapid
        continue-on-error: true
        working-directory: cf-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          # Staan ze er al? Dan afblijven. Nieuwe sleutels maken elk bestaand
          # abonnement ongeldig, en dat mag nooit een bijvangst zijn van een
          # run die eigenlijk voor de KV-namespace bedoeld is.
          npx --yes wrangler@4 secret list > secrets.json 2>/dev/null || echo '[]' > secrets.json
          AL=$(node -e "
            const t=require('fs').readFileSync('secrets.json','utf8');
            const a=t.indexOf('['), b=t.lastIndexOf(']');
            let l=[]; if(a!==-1&&b>a){ try{ l=JSON.parse(t.slice(a,b+1)) }catch{} }
            const n=l.map(x=>x.name||'');
            console.log(n.includes('VAPID_PUBLIC_KEY') && n.includes('VAPID_PRIVATE_KEY') ? 'ja' : 'nee');
          ")
          if [ "$AL" = "ja" ]; then
            echo 'Beide VAPID-secrets bestaan al — ongemoeid gelaten.'
            exit 0
          fi
          node generate-vapid.mjs > paar.txt
          PUB=$(sed -n '3p' paar.txt)
          PRIV=$(sed -n '6p' paar.txt)
          if [ ${#PUB} -lt 80 ] || [ -z "$PRIV" ]; then echo '::error::sleutelpaar onvolledig'; exit 1; fi
          # De publieke sleutel mag in het log; de privé nadrukkelijk niet.
          echo "::notice title=VAPID_PUBLIC_KEY::$PUB"
          printf '%s' "$PUB"  | npx --yes wrangler@4 secret put VAPID_PUBLIC_KEY
          printf '%s' "$PRIV" | npx --yes wrangler@4 secret put VAPID_PRIVATE_KEY
          rm -f paar.txt
          echo 'Beide secrets gezet.'

      - name: 📋 Uitkomst
        run: |
          echo "KV-namespace : ${{ steps.kv.outcome }}  ${{ steps.kv.outputs.KV_ID }}"
          echo "VAPID-secrets: ${{ steps.vapid.outcome }}"
          if [ "${{ steps.kv.outcome }}" = "success" ]; then
            echo ""
            echo "Zet dit in cf-worker/wrangler.toml en push:"
            echo "[[kv_namespaces]]"
            echo 'binding = "SUBS"'
            echo 'id = "${{ steps.kv.outputs.KV_ID }}"'
          fi
