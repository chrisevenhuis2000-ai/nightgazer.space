name: 🤖 Auto-Fetch Articles

on:
  schedule:
    # Dagelijks 07:17 UTC. Niet op het hele uur: GitHub vertraagt geplande
    # runs op :00 het sterkst (missie-runs liepen uren te laat).
    # Sinds oktober 2026 start de Cloudflare Worker deze workflow om 07:17
    # UTC zelf (cf-worker/workflows.mjs). Deze schedule blijft als vangnet.
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      bron:
        description: 'Wie start de run? De Worker zet hier "worker"; handmatig draait altijd.'
        required: false
        default: 'handmatig'

jobs:
  # Vangnet tegen dubbel werk: een geplande run (of de Worker) stopt meteen
  # als er vandaag (UTC) al een geslaagde run van deze workflow was. Een
  # handmatige run uit GitHub draait altijd.
  vandaag:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      al_gedaan: ${{ steps.check.outputs.al_gedaan }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BRON: ${{ github.event_name == 'schedule' && 'schedule' || inputs.bron }}
        run: |
          if [ "$BRON" = "handmatig" ]; then
            echo "al_gedaan=false" >> "$GITHUB_OUTPUT"
            echo "Handmatige run: draait altijd."
            exit 0
          fi
          vandaag=$(date -u +%Y-%m-%d)
          n=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/fetch-articles.yml/runs" \
                -f status=success -f created=">=${vandaag}" --jq '.total_count')
          if [ "${n:-0}" -gt 0 ]; then
            echo "al_gedaan=true" >> "$GITHUB_OUTPUT"
            echo "Vandaag al ${n} geslaagde run(s); deze ($BRON) slaat over." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "al_gedaan=false" >> "$GITHUB_OUTPUT"
            echo "Vandaag nog geen geslaagde run; deze ($BRON) draait."
          fi

  fetch-and-publish:
    needs: vandaag
    if: needs.vandaag.outputs.al_gedaan != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch new articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run fetch-articles

      - name: Commit new articles
        run: |
          git config --local user.email "bot@cosmosnl.nl"
          git config --local user.name "CosmosNL Bot"
          git add content/articles/
          git diff --staged --quiet || git commit -m "🤖 Auto-fetch: $(date '+%Y-%m-%d') nieuwe artikelen"
          git push
        continue-on-error: true

      - name: Backfill images for new articles
        run: node scripts/backfill-images.js

      - name: Commit image updates
        run: |
          git config --local user.email "bot@cosmosnl.nl"
          git config --local user.name "CosmosNL Bot"
          git add content/articles/
          git diff --staged --quiet || git commit -m "🖼️ Auto-backfill: afbeeldingen bijgewerkt $(date '+%Y-%m-%d')"
          git push
        continue-on-error: true

      - name: Trigger Vercel/Cloudflare deployment
        # Uncomment and add your deploy hook URL as a secret
        # run: curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
        run: echo "✅ Articles fetched, images backfilled and committed"
