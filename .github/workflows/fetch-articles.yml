name: 🤖 Auto-Fetch Articles

on:
  schedule:
    # Dagelijks 07:17 UTC. Niet op het hele uur: GitHub vertraagt geplande
    # runs op :00 het sterkst (missie-runs liepen uren te laat).
    - cron: '17 7 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch new articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run fetch-articles

      - name: Commit new articles
        run: |
          git config --local user.email "bot@cosmosnl.nl"
          git config --local user.name "CosmosNL Bot"
          git add content/articles/
          git diff --staged --quiet || git commit -m "🤖 Auto-fetch: $(date '+%Y-%m-%d') nieuwe artikelen"
          git push
        continue-on-error: true

      - name: Backfill images for new articles
        run: node scripts/backfill-images.js

      - name: Commit image updates
        run: |
          git config --local user.email "bot@cosmosnl.nl"
          git config --local user.name "CosmosNL Bot"
          git add content/articles/
          git diff --staged --quiet || git commit -m "🖼️ Auto-backfill: afbeeldingen bijgewerkt $(date '+%Y-%m-%d')"
          git push
        continue-on-error: true

      - name: Trigger Vercel/Cloudflare deployment
        # Uncomment and add your deploy hook URL as a secret
        # run: curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
        run: echo "✅ Articles fetched, images backfilled and committed"
