name = "cosmosnl-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"
account_id = "81e3376cdf10af6f23d939f91c4d920c"

# Custom domain — requires DNS on Cloudflare for nightgazer.space
# Uncomment when DNS is configured:
# [env.production]
# routes = [{ pattern = "api.nightgazer.space", custom_domain = true }]

# ── Pushmeldingen ─────────────────────────────────────────────────────────
# De cron draait ook zonder de KV hieronder: de handler stopt dan meteen.
# Zo blijft `wrangler deploy` werken tot de rest is ingericht.
[triggers]
crons = ["*/15 * * * *"]

# De opslag voor pushabonnementen. Aangemaakt op 26-09-2026 via
# .github/workflows/setup-push.yml; de VAPID-sleutels staan als secret op de
# worker (VAPID_PUBLIC_KEY en VAPID_PRIVATE_KEY).
#
# Valt deze binding ooit weg, dan antwoordt /push/key dat de dienst niet leeft
# en toont de site dat eerlijk in plaats van een knop die niets doet.
[[kv_namespaces]]
binding = "SUBS"
id = "62db9e6a234047c5907a7c18f4f99151"
