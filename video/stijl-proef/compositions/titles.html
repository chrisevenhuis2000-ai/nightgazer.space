<!doctype html>
<html lang="nl">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        /* Captions: 1-3 words, bold white, soft shadow, centred at ~61% height (inside the IG safe zone). */
        .cap { position: absolute; left: 90px; right: 90px; top: 1130px; text-align: center; opacity: 0;
               font: 800 70px/1.08 "Archivo", sans-serif; letter-spacing: -0.012em; color: #FFFFFF;
               text-shadow: 0 4px 0 rgba(4,6,20,0.35), 0 2px 18px rgba(4,6,20,0.85), 0 0 42px rgba(4,6,20,0.6); }
        .cap em { font-style: normal; color: #FF7C89; }
        #outro { position: absolute; left: 0; right: 0; top: 1092px; display: flex; flex-direction: column; align-items: center; gap: 22px; opacity: 0; }
        #outro img { width: 520px; height: 104px; }
        #outro p { font: 700 40px/1 "Archivo", sans-serif; color: #CFE3FF; letter-spacing: 0.01em;
                   text-shadow: 0 2px 18px rgba(4,6,20,0.85); }
      </style>

      <div id="root" data-composition-id="titles" data-width="1080" data-height="1920">
        <div id="caps"></div>
        <div id="outro">
          <img src="../assets/brand/logo-transparent.png" alt="NightGazer.space" width="520" height="104" />
          <p>Meer uitleg: link in bio</p>
        </div>
      </div>

      <script>
        (function () {
          const R = window.__REEL, TJ = window.__TIJDEN;
          const tl = gsap.timeline({ paused: true });
          const host = document.getElementById("caps");
          // Split a line into chunks of at most 3 words / ~17 characters; *word* = coral emphasis.
          function chunks(text) {
            const words = text.split(/\s+/).filter(Boolean), out = [];
            let cur = [];
            const len = (a) => a.join(" ").replace(/\*/g, "").length;
            for (const w of words) {
              if (w.startsWith("*") && cur.length) { out.push(cur.join(" ")); cur = []; }
              const nxt = [...cur, w];
              const open = (nxt.join(" ").match(/\*/g) || []).length % 2 === 1; // never split inside *...*
              if (cur.length && !open && (nxt.length > 3 || len(nxt) > 17) && (cur.join(" ").match(/\*/g) || []).length % 2 === 0) { out.push(cur.join(" ")); cur = [w]; }
              else cur = nxt;
              if (/[.,:?!]$/.test(w) && !open && cur.length >= 1) { out.push(cur.join(" ")); cur = []; }
            }
            if (cur.length) out.push(cur.join(" "));
            // no orphans: glue a short single word to its neighbour when the pair still fits
            const L2 = (x) => x.replace(/\*/g, "").length;
            for (let i = 0; i < out.length; i++) {
              if (out.length < 2 || out[i].includes(" ") || L2(out[i]) > 8) continue;
              if (i > 0 && L2(out[i - 1] + " " + out[i]) <= 20) { out[i - 1] += " " + out[i]; out.splice(i, 1); i--; }
              else if (i < out.length - 1 && L2(out[i] + " " + out[i + 1]) <= 22) { out[i + 1] = out[i] + " " + out[i + 1]; out.splice(i, 1); i--; }
            }
            return out;
          }
          const html = (s) => s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
          const caps = [];
          R.lijnen.forEach((l, i) => {
            const [a, b] = TJ.lijnen[i];
            const parts = chunks(l.tekst);
            const w = parts.map((p) => p.replace(/\*/g, "").length + 3);
            const tot = w.reduce((x, y) => x + y, 0);
            let t = a;
            parts.forEach((p, j) => {
              const d = ((b - a) * w[j]) / tot;
              caps.push({ txt: p, a: t, b: t + d, last: j === parts.length - 1, next: TJ.lijnen[i + 1] ? TJ.lijnen[i + 1][0] : b + 0.4 });
              t += d;
            });
          });
          caps.forEach((c, k) => {
            const el = document.createElement("p"); el.className = "cap"; el.id = "cap-" + k; el.innerHTML = html(c.txt);
            host.appendChild(el);
            const end = c.last ? Math.min(c.next, c.b + 0.35) : c.b;
            tl.set(el, { opacity: 1 }, c.a);
            tl.fromTo(el, { scale: 0.92, y: 10 }, { scale: 1, y: 0, duration: 0.16, ease: "back.out(2)" }, c.a);
            tl.set(el, { opacity: 0 }, end);
          });
          const eind = TJ.lijnen[TJ.lijnen.length - 1][1] + 0.3;
          tl.fromTo("#outro", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, eind);
          tl.set({}, {}, TJ.dur);
          window.__timelines["titles"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
