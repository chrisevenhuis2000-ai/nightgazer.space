<!doctype html>
<html lang="nl">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        /* A quiet dark field under the top lines: the text always sits on calm ground. */
        #titles-scrim { position: absolute; left: 0; right: 0; top: 180px; height: 560px;
                        background: linear-gradient(rgba(5,6,13,0) 0%, rgba(5,6,13,0.78) 18%, rgba(5,6,13,0.78) 62%, rgba(5,6,13,0) 100%); }
        #titles-field { position: absolute; left: 140px; right: 140px; top: 640px; height: 600px;
                        background: radial-gradient(60% 50% at 50% 50%, rgba(5,6,13,0.85), rgba(5,6,13,0) 100%); }
        .titles-line { position: absolute; left: 96px; right: 96px; top: 286px;
                       font: 800 118px/1.0 var(--sans); letter-spacing: -0.035em; color: var(--pl-ink); }
        .titles-line span { display: block; padding-right: 0.06em; }
        #titles-wipe { position: absolute; left: 96px; top: 270px; width: 1px; height: 290px; background: var(--pl-stamp); opacity: 0; }

        #titles-end { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
        #titles-logo { position: absolute; left: 290px; top: 700px; width: 500px; height: 100px; }   /* native size */
        #titles-domain { position: absolute; left: 0; right: 0; top: 880px; text-align: center;
                         font: 800 92px/1 var(--sans); letter-spacing: -0.035em; color: var(--pl-ink); }
        #titles-cta { position: absolute; left: 50%; top: 1070px; transform: translateX(-50%);
                      height: 124px; padding: 0 64px; display: flex; align-items: center; gap: 24px; white-space: nowrap;
                      background: var(--pl-act); color: var(--pl-act-ink); font: 700 50px/1 var(--sans); letter-spacing: -0.01em; }
        #titles-cta svg { width: 46px; height: 28px; display: block; }
      </style>

      <div id="root" data-composition-id="titles" data-width="1080" data-height="1920">
        <div id="titles-scrim"></div>
        <h1 id="titles-hook" class="titles-line"><span>Kun je vannacht</span><span>iets zien?</span></h1>
        <p id="titles-promise" class="titles-line"><span>Ruimtenieuws.</span><span>Op jouw niveau.</span></p>
        <i id="titles-wipe"></i>

        <div id="titles-end">
          <div id="titles-field"></div>
          <img id="titles-logo" src="../assets/brand/logo-transparent.png" alt="NightGazer.space" width="500" height="100" />
          <p id="titles-domain">nightgazer.space</p>
          <div id="titles-cta">
            <span>Vannacht kijken</span>
            <svg viewBox="0 0 34 20" aria-hidden="true"><path d="M1 10 H31 M23 2.5 L31 10 L23 17.5" fill="none" stroke="#06131A" stroke-width="2.5"/></svg>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          // 1 — Hook. Complete in frame 0 (the poster), still until 1.4333 (frame 43), then swept off by a hairline.
          tl.set("#titles-wipe", { opacity: 1 }, 1.4333);
          tl.fromTo("#titles-wipe", { x: 0 }, { x: 888, duration: 0.1667, ease: "power2.in", immediateRender: false }, 1.4333);
          tl.fromTo("#titles-hook", { clipPath: "inset(-10% -5% -10% 0%)" },
                    { clipPath: "inset(-10% -5% -10% 105%)", duration: 0.1667, ease: "power2.in", immediateRender: false }, 1.4333);
          tl.set("#titles-wipe", { opacity: 0 }, 1.6);

          // 2 — Promise. Revealed by 2.49 (from frame 68), still until 3.8 (frame 114).
          tl.fromTo("#titles-promise", { clipPath: "inset(-10% 105% -10% 0%)" },
                    { clipPath: "inset(-10% -5% -10% 0%)", duration: 0.22, ease: "power3.out" }, 2.2667);
          tl.to("#titles-promise", { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power1.in" }, 3.8);
          tl.to("#titles-scrim", { opacity: 0, duration: 0.5, ease: "power1.in" }, 3.9);

          // 3 — Sign-off on the lifted plate. Settled by 8.95, then completely still.
          tl.fromTo("#titles-field", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 8.3);
          tl.fromTo("#titles-logo", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 8.4);
          tl.fromTo("#titles-domain", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 8.5333);
          tl.fromTo("#titles-cta", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.32, ease: "power3.inOut" }, 8.6333);

          tl.set({}, {}, 10);
          window.__timelines["titles"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
