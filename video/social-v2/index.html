    <!--
      NightGazer social v2 — "Vanaf je eigen dak". 1080x1920, 30 fps, 10.0 s, no audio.
      Cuts and hits (see README for the music grid):
        0.00  Earth at night over the Low Countries (NASA Black Marble), hook on the poster frame
        1.60  match cut: Earth's horizon becomes the limb of a (procedural) giant planet
        2.28  "Ruimtenieuws. Op jouw niveau."
        4.20  the camera climbs over the limb into M74 (ESA/Webb), 2.5D parallax
        7.20  the view is lifted out as a glass plate onto the lightbox
        8.40  logo, nightgazer.space, Vannacht kijken — completely still from 9.0
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="el-stage" class="clip" data-composition-id="stage" data-composition-src="compositions/stage.html"
        data-start="0" data-duration="10" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="el-plate" class="clip" data-composition-id="plate" data-composition-src="compositions/plate.html"
        data-start="0" data-duration="10" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="el-titles" class="clip" data-composition-id="titles" data-composition-src="compositions/titles.html"
        data-start="0" data-duration="10" data-track-index="2" data-width="1080" data-height="1920"></div>
    </div>
