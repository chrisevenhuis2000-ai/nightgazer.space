<!doctype html>
<html lang="nl">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #04050b; overflow: hidden; }
        #stage-gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        #stage-vignette { position: absolute; inset: 0;
                          background: radial-gradient(85% 70% at 50% 46%, rgba(4,5,11,0) 58%, rgba(4,5,11,0.82) 100%); }
        #stage-flash { position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen;
                       background: radial-gradient(60% 45% at 50% 45%, rgba(220,240,255,0.95), rgba(61,207,223,0.35) 50%, rgba(4,5,11,0) 85%); }
        #stage-grain { position: absolute; inset: -64px; mix-blend-mode: overlay; opacity: 0.16; }
      </style>

      <div id="root" data-composition-id="stage" data-width="1080" data-height="1920">
        <canvas id="stage-gl" width="1080" height="1920"></canvas>
        <div id="stage-vignette"></div>
        <div id="stage-flash"></div>
        <div id="stage-grain" data-layout-allow-overflow></div>
      </div>

      <script>
        (function () {
          const T = window.__RACE_T;
          const tl = gsap.timeline({ paused: true });
          // Flash on the hard cuts and the big hits.
          [[T.duel, 0.7], [T.pass3, 1.0], [T.back, 0.6], [T.finale, 0.9]].forEach(([c, o]) => {
            tl.fromTo("#stage-flash", { opacity: 0 }, { opacity: o, duration: 0.1, ease: "power2.in" }, c - 0.1);
            tl.to("#stage-flash", { opacity: 0, duration: 0.5, ease: "power2.out" }, c);
          });
          tl.set({}, {}, T.dur);
          window.__timelines["stage"] = tl;
        })();
      </script>

      <script type="module">
        import * as THREE from "three";
        import { starfield, grainTile, rng, ease, lerp, clamp01 } from "./assets/space.js";

        const T = window.__RACE_T, YK = window.__RACE_YEAR, RACE = window.__RACE;
        const W = 1080, H = 1920, FPS = 30;
        const smooth = (x) => { x = clamp01(x); return x * x * x * (x * (x * 6 - 15) + 10); };
        const win = (t, a, b, fi = 0.25, fo = 0.25) => clamp01((t - a) / fi) * clamp01((b - t) / fo);

        // ── Story time and data ────────────────────────────────────────────────────────────────
        function yearAt(t) {
          if (t <= YK[0][0]) return YK[0][1];
          for (let i = 0; i < YK.length - 1; i++) {
            const [t0, y0] = YK[i], [t1, y1] = YK[i + 1];
            if (t <= t1) return lerp(y0, y1, smooth((t - t0) / (t1 - t0)));
          }
          return YK[YK.length - 1][1];
        }
        const P = {}; RACE.probes.forEach((p) => (P[p.id] = p));
        function auAt(p, y) {
          if (y < p.start) return null;
          const a = p.au;
          if (y <= a[0][0]) return a[0][1];
          for (let i = 0; i < a.length - 1; i++) if (y <= a[i + 1][0]) return lerp(a[i][1], a[i + 1][1], (y - a[i][0]) / (a[i + 1][0] - a[i][0]));
          return a[a.length - 1][1];
        }
        function order(y) {
          return RACE.probes.filter((p) => y >= p.start).map((p) => [p.id, auAt(p, y)]).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
        }
        // Smoothed slot: average of the discrete slot over the last 0.42 s → rows glide when they swap.
        function slotOf(id, t) {
          let s = 0; const N = 10;
          for (let i = 0; i < N; i++) {
            const o = order(yearAt(t - (0.42 * i) / (N - 1)));
            const k = o.indexOf(id); s += k < 0 ? 6.5 : k;
          }
          return s / N;
        }
        const nl = (v, d = 1) => v.toFixed(d).replace(".", ",");

        // ── Renderer ───────────────────────────────────────────────────────────────────────────
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("stage-gl"), antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(W, H, false); renderer.setPixelRatio(1);
        renderer.setClearColor(0x04050b, 1); renderer.autoClear = false;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;

        // ── 2D textures (canvas) ───────────────────────────────────────────────────────────────
        const logo = new Image(); logo.src = "assets/brand/logo-transparent.png";
        function canvasTex(w, h) {
          const c = document.createElement("canvas"); c.width = w; c.height = h;
          const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8;
          return { c, ctx: c.getContext("2d"), tx };
        }
        function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
        const SANS = (w, s) => `${w} ${s}px Archivo, sans-serif`;
        const MONO = (w, s) => `${w} ${s}px "JetBrains Mono", monospace`;

        // A small probe glyph: dish + boom, in the probe colour.
        function glyph(ctx, x, y, s, col) {
          ctx.save(); ctx.translate(x, y); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = s * 0.09; ctx.lineCap = "round";
          ctx.beginPath(); ctx.ellipse(0, 0, s * 0.42, s * 0.16, -0.5, 0, Math.PI * 2); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(-s * 0.05, s * 0.05); ctx.lineTo(s * 0.45, s * 0.42); ctx.stroke();
          ctx.beginPath(); ctx.arc(s * 0.47, s * 0.44, s * 0.08, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-s * 0.18, -s * 0.36); ctx.stroke();
          ctx.restore();
        }

        // Row tile face: probe name, distance in AE, status.
        function drawRow(r, p, au, hi, state) {
          const { ctx, c } = r, w = c.width, h = c.height;
          ctx.clearRect(0, 0, w, h);
          const g = ctx.createLinearGradient(0, 0, 0, h);
          if (hi) { g.addColorStop(0, "#E9F6FA"); g.addColorStop(1, "#B9DCE6"); }
          else { g.addColorStop(0, "#1B1F3D"); g.addColorStop(1, "#121530"); }
          ctx.fillStyle = g; rrect(ctx, 0, 0, w, h, 18); ctx.fill();
          if (!hi) { ctx.strokeStyle = "rgba(181,212,244,0.16)"; ctx.lineWidth = 3; rrect(ctx, 1.5, 1.5, w - 3, h - 3, 17); ctx.stroke(); }
          // colour stripe
          ctx.fillStyle = p.kleur; rrect(ctx, 0, 0, 14, h, [18, 0, 0, 18]); ctx.fill();
          const ink = hi ? "#06131A" : "#EEF2FB", dim = state === "stil";
          glyph(ctx, 92, h / 2 - 4, 86, hi ? "#0A6B78" : p.kleur);
          ctx.fillStyle = dim ? "rgba(238,242,251,0.45)" : ink; ctx.font = SANS(800, 76); ctx.textBaseline = "middle";
          ctx.fillText(p.naam, 168, h / 2 + 3);
          if (au != null) {
            ctx.textAlign = "right"; ctx.font = MONO(500, 58);
            ctx.fillStyle = hi ? "#0A4E58" : dim ? "rgba(154,166,200,0.55)" : "#9FE6EE";
            ctx.fillText(nl(au) + " AE", w - 34, h / 2 + 4);
            ctx.textAlign = "left";
          }
          if (dim) {
            ctx.font = SANS(800, 34); const tw = ctx.measureText("STIL").width + 34;
            const x = 168 + ctx.measureText(p.naam).width * (76 / 34) * 0 + 0;
            ctx.fillStyle = "#E5484D"; rrect(ctx, w - 470, h / 2 - 27, tw, 54, 8); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.fillText("STIL", w - 470 + 17, h / 2 + 2);
          }
          r.tx.needsUpdate = true;
        }
        function drawNum(r, n) {
          const { ctx, c } = r; ctx.clearRect(0, 0, c.width, c.height);
          ctx.fillStyle = "#EEF2FB"; ctx.font = SANS(800, 120); ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(String(n), c.width / 2, c.height / 2 + 6); r.tx.needsUpdate = true;
        }
        function drawHeader(r, y) {
          const { ctx, c } = r, w = c.width, h = c.height;
          ctx.clearRect(0, 0, w, h);
          const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#1E2246"); g.addColorStop(1, "#111430");
          ctx.fillStyle = g; rrect(ctx, 0, 0, w, h, 22); ctx.fill();
          ctx.strokeStyle = "rgba(181,212,244,0.22)"; ctx.lineWidth = 3; rrect(ctx, 1.5, 1.5, w - 3, h - 3, 21); ctx.stroke();
          if (logo.complete && logo.naturalWidth) ctx.drawImage(logo, w / 2 - 300, 34, 600, 120);
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#9AA6C8"; ctx.font = SANS(700, 44); ctx.textAlign = "left";
          ctx.fillText("VERSTE SONDES", 48, 236);
          ctx.textAlign = "right"; ctx.fillStyle = "#EEF2FB"; ctx.font = SANS(700, 44);
          const yy = Math.floor(y);
          ctx.fillText("JAAR", w - 290, 236);
          ctx.font = MONO(500, 78); ctx.fillStyle = "#3DCFDF"; ctx.fillText(String(yy), w - 48, 240);
          r.tx.needsUpdate = true;
        }
        const BANNERS = {
          launch:  { bg: "#F5D547", ink: "#14130A", a: "LANCERING",          b: "VOYAGER 2 · VOYAGER 1" },
          jupiter: { bg: "#8B3DF0", ink: "#FFFFFF", a: "ZWAARTEKRACHTSLINGER", b: "JUPITER · MAART 1979" },
          stil:    { bg: "#E5484D", ink: "#FFFFFF", a: "SIGNAAL STIL",       b: "PIONEER 10 · JANUARI 2003" },
          nh:      { bg: "#8B3DF0", ink: "#FFFFFF", a: "SNELSTE LANCERING",  b: "NEW HORIZONS · 2006" },
          inter:   { bg: "#3DCFDF", ink: "#06131A", a: "INTERSTELLAIR",      b: "VOYAGER 1 · AUGUSTUS 2012" },
        };
        function drawBanner(r, key) {
          const { ctx, c } = r, w = c.width, h = c.height, B = BANNERS[key];
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = B.bg; rrect(ctx, 0, 0, w, h, 18); ctx.fill();
          ctx.fillStyle = B.ink; ctx.textBaseline = "middle"; ctx.textAlign = "left";
          ctx.font = SANS(800, B.a.length > 14 ? 84 : 104); ctx.fillText(B.a, 40, h * 0.40);
          ctx.font = SANS(700, 40); ctx.globalAlpha = 0.85; ctx.fillText(B.b, 44, h * 0.80); ctx.globalAlpha = 1;
          r.tx.needsUpdate = true;
        }

        // ── Shared 3D pieces ───────────────────────────────────────────────────────────────────
        const sideMat = new THREE.MeshStandardMaterial({ color: 0x1a1e3c, metalness: 0.75, roughness: 0.32 });
        function faceMat(tx) {
          return new THREE.MeshStandardMaterial({ map: tx, emissiveMap: tx, emissive: 0xffffff, emissiveIntensity: 0.82,
                                                  metalness: 0.2, roughness: 0.45, transparent: true });
        }
        function tile(w, h, d, tex) {
          const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [sideMat, sideMat, sideMat, sideMat, faceMat(tex.tx), sideMat]);
          return m;
        }

        // Smoke / nebula billboards: fbm noise, seeded, drifting with time.
        const SMOKE_VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
        const SMOKE_FS = `
          uniform float uT; uniform float uSeed; uniform vec3 uColor; uniform float uOp; uniform float uDense;
          varying vec2 vUv;
          float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
          float n(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
            return mix(mix(h(i),h(i+vec2(1,0)),u.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x), u.y); }
          float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*n(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return v; }
          void main(){
            vec2 p = vUv - .5; float r = length(p) * 2.;
            vec2 q = vUv * 2.2 + vec2(uSeed * 3.1, uSeed * 7.7);
            float w = fbm(q * 1.4 + vec2(-uT * .05, uT * .04));
            float v = fbm(q + vec2(uT * .06, -uT * .045) + w * 1.3);
            float a = smoothstep(1.0, 0.15, r) * smoothstep(.32 - uDense * .12, .82, v) * uOp;
            gl_FragColor = vec4(uColor * (.55 + .9 * v), a);
          }`;
        function smoke({ seed, n, center, spread, size, color, additive = false }) {
          const g = new THREE.Group(); const r = rng(seed); const mats = [];
          for (let i = 0; i < n; i++) {
            const m = new THREE.ShaderMaterial({ vertexShader: SMOKE_VS, fragmentShader: SMOKE_FS, transparent: true, depthWrite: false,
              blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
              uniforms: { uT: { value: 0 }, uSeed: { value: r() * 10 }, uColor: { value: new THREE.Color(color) }, uOp: { value: 0 }, uDense: { value: 0 } } });
            const s = size * (0.6 + r() * 0.8);
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(s, s), m);
            mesh.position.set(center[0] + (r() - 0.5) * spread[0], center[1] + (r() - 0.5) * spread[1], center[2] + (r() - 0.5) * spread[2]);
            mesh.userData.base = mesh.position.clone(); mesh.userData.drift = [(r() - 0.5) * 0.25, (r() - 0.5) * 0.18, (r() - 0.5) * 0.12];
            mesh.userData.spin = (r() - 0.5) * 0.3;
            g.add(mesh); mats.push(m);
          }
          g.userData.update = (t, cam, op, col, dense = 0) => {
            g.children.forEach((m, i) => {
              m.position.copy(m.userData.base).add(new THREE.Vector3(...m.userData.drift).multiplyScalar(t));
              m.quaternion.copy(cam.quaternion); m.rotateZ(m.userData.spin * t + i);
              const u = m.material.uniforms; u.uT.value = t; u.uOp.value = op; u.uDense.value = dense; if (col) u.uColor.value.set(col);
            });
            g.visible = op > 0.001;
          };
          return g;
        }

        // Light rays bursting from a point (the "laser" moment), additive.
        const RAY_FS = `uniform vec3 uColor; uniform float uOp; varying vec2 vUv;
          void main(){ float a = (1.0 - vUv.x) * smoothstep(0.0, 0.5, vUv.y) * smoothstep(1.0, 0.5, vUv.y);
            gl_FragColor = vec4(uColor, a * a * uOp); }`;
        function rays({ seed, n, color, len = 26, width = 0.12 }) {
          const g = new THREE.Group(); const r = rng(seed);
          const geo = new THREE.PlaneGeometry(1, 1); geo.translate(0.5, 0, 0);
          for (let i = 0; i < n; i++) {
            const m = new THREE.ShaderMaterial({ vertexShader: SMOKE_VS, fragmentShader: RAY_FS, transparent: true, depthWrite: false,
              blending: THREE.AdditiveBlending, side: THREE.DoubleSide, uniforms: { uColor: { value: new THREE.Color(color) }, uOp: { value: 0 } } });
            const mesh = new THREE.Mesh(geo, m);
            const a = r() * Math.PI * 2, el = (r() - 0.5) * 1.2;
            mesh.rotation.set(0, el, a); mesh.scale.set(len * (0.4 + r() * 0.8), width * (0.4 + r() * 1.4), 1);
            mesh.userData.ph = r() * 6.28; mesh.userData.k = 0.5 + r();
            g.add(mesh);
          }
          g.userData.update = (t, op) => {
            const f = Math.floor(t * FPS);
            g.children.forEach((m) => { m.material.uniforms.uOp.value = op * (0.55 + 0.45 * Math.sin(f * 0.9 * m.userData.k + m.userData.ph)); });
            g.visible = op > 0.001;
          };
          return g;
        }

        // Particle burst (sparks), pure function of age.
        function burst({ seed, n, color, speed = 6, size = 26, gravity = -1.2 }) {
          const r = rng(seed), pos = new Float32Array(n * 3), vel = new Float32Array(n * 3), sz = new Float32Array(n);
          for (let i = 0; i < n; i++) {
            const u = r() * 2 - 1, th = r() * 6.283, s = Math.sqrt(1 - u * u), v = speed * (0.3 + r() * 0.9);
            vel.set([s * Math.cos(th) * v, u * v, s * Math.sin(th) * v], i * 3); sz[i] = size * (0.3 + r());
          }
          const g = new THREE.BufferGeometry();
          g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
          g.setAttribute("vel", new THREE.BufferAttribute(vel, 3)); g.setAttribute("sz", new THREE.BufferAttribute(sz, 1));
          const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
            uniforms: { uAge: { value: 0 }, uOp: { value: 0 }, uColor: { value: new THREE.Color(color) }, uG: { value: gravity } },
            vertexShader: `attribute vec3 vel; attribute float sz; uniform float uAge; uniform float uG; varying float vA;
              void main(){ float k = 1.0 - exp(-uAge * 2.2); vec3 p = position + vel * k * 0.8 + vec3(0.0, uG * uAge * uAge, 0.0);
                vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_Position = projectionMatrix * mv;
                gl_PointSize = sz * 6.0 / max(-mv.z, 0.1); vA = 1.0 - smoothstep(0.2, 1.6, uAge); }`,
            fragmentShader: `uniform vec3 uColor; uniform float uOp; varying float vA;
              void main(){ vec2 p = gl_PointCoord - .5; float c = exp(-dot(p,p) * 22.0); gl_FragColor = vec4(uColor * c * vA * uOp * 1.6, 1.0); }` });
          const pts = new THREE.Points(g, m); pts.frustumCulled = false;
          pts.userData.update = (age, op) => { m.uniforms.uAge.value = Math.max(0, age); m.uniforms.uOp.value = age < 0 ? 0 : op; pts.visible = age >= 0 && op > 0; };
          return pts;
        }

        // Warp streaks for the fast-forwards: line segments flying past along z.
        function streaks({ seed, n }) {
          const r = rng(seed), base = [];
          for (let i = 0; i < n; i++) { const a = r() * 6.283, rad = 2.5 + r() * 14; base.push([Math.cos(a) * rad, Math.sin(a) * rad, r() * 80, 0.6 + r() * 1.4]); }
          const pos = new Float32Array(n * 6), col = new Float32Array(n * 6);
          const g = new THREE.BufferGeometry();
          g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); g.setAttribute("color", new THREE.BufferAttribute(col, 3));
          const m = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
          const L = new THREE.LineSegments(g, m); L.frustumCulled = false;
          L.userData.update = (t, cam, op, speed) => {
            const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(cam.quaternion), up = new THREE.Vector3(0, 1, 0).applyQuaternion(cam.quaternion);
            base.forEach(([x, y, z0, k], i) => {
              const z = 80 - ((z0 + t * speed * 60 * k) % 80) + 1.5;
              const len = Math.min(z * 0.6, speed * 3.2 * k);
              const a = cam.position.clone().addScaledVector(right, x).addScaledVector(up, y).addScaledVector(fwd, z);
              const b = a.clone().addScaledVector(fwd, len);
              pos.set([a.x, a.y, a.z, b.x, b.y, b.z], i * 6);
              const c = 0.9 * op; col.set([c * 0.6, c * 0.9, c, 0, 0, 0], i * 6);
            });
            g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true; L.visible = op > 0.001;
          };
          return L;
        }

        // Fake-extruded text: stacked planes of one canvas texture, darker towards the back.
        function extruded(text, { color = "#EEF2FB", depth = 0.5, layers = 16, height = 2.2, font = SANS(800, 220), wpx = 1400 } = {}) {
          const r = canvasTex(wpx, 300);
          const draw = (s) => { const { ctx, c } = r; ctx.clearRect(0, 0, c.width, c.height); ctx.fillStyle = "#fff"; ctx.font = font;
            ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(s, c.width / 2, c.height / 2 + 10); r.tx.needsUpdate = true; };
          draw(text);
          const g = new THREE.Group(); const w = height * (wpx / 300); const base = new THREE.Color(color);
          for (let i = 0; i < layers; i++) {
            const k = i / (layers - 1);
            const m = new THREE.MeshBasicMaterial({ map: r.tx, transparent: true, depthWrite: false,
              color: i === 0 ? base.clone().multiplyScalar(1.25) : base.clone().multiplyScalar(0.18 + 0.32 * (1 - k)) });
            const pl = new THREE.Mesh(new THREE.PlaneGeometry(w, height), m);
            pl.position.z = -k * depth; pl.renderOrder = layers - i; g.add(pl);
          }
          g.userData.set = draw; g.userData.op = (o) => g.children.forEach((pl) => (pl.material.opacity = o)); return g;
        }

        // Camera keys: {t, p, l, roll, fov}; p/l may be functions of t (tracking). Smooth between keys, cut on equal t.
        function camAt(keys, t, cam) {
          let i = 0; while (i < keys.length - 1 && t >= keys[i + 1].t) i++;
          const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)];
          const k = b.t > a.t ? (b.ease || smooth)(clamp01((t - a.t) / (b.t - a.t))) : 0;
          const v = (x) => (typeof x === "function" ? x(t) : x);
          const pa = v(a.p), pb = v(b.p), la = v(a.l), lb = v(b.l);
          cam.position.set(lerp(pa[0], pb[0], k), lerp(pa[1], pb[1], k), lerp(pa[2], pb[2], k));
          cam.up.set(0, 1, 0);
          cam.lookAt(lerp(la[0], lb[0], k), lerp(la[1], lb[1], k), lerp(la[2], lb[2], k));
          cam.rotateZ(lerp(a.roll || 0, b.roll || 0, k));
          cam.fov = lerp(a.fov || 32, b.fov || 32, k); cam.updateProjectionMatrix(); cam.updateMatrixWorld();
        }

        // ══ SCENE A: the timing tower ════════════════════════════════════════════════════════
        const tower = new THREE.Scene();
        tower.add(new THREE.AmbientLight(0x9fb0ff, 0.5));
        const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-4, 6, 10); tower.add(key);
        const rim = new THREE.PointLight(0x3dcfdf, 40, 30, 1.6); rim.position.set(6, 2, 4); tower.add(rim);
        const stars = starfield({ seed: 77 }); tower.add(stars);
        const nebBack = smoke({ seed: 5, n: 14, center: [0, 0, -30], spread: [50, 60, 8], size: 34, color: "#1d3d8f", additive: true });
        const nebBack2 = smoke({ seed: 6, n: 8, center: [4, -6, -26], spread: [40, 40, 6], size: 30, color: "#4b1f8f", additive: true });
        tower.add(nebBack, nebBack2);

            for (let i = 0; i < n; i++) {

        // ══ SCENE C: the finish — one light-day (18 November 2026) ═══════════════════════════
        const fin = new THREE.Scene();

        // ══ Frame ═════════════════════════════════════════════════════════════════════════════
        const grain = document.getElementById("stage-grain");
        function renderAt(t) {
          renderer.clear();
          if (t >= T.duel && t < T.back) renderDuel(t);
          else if (t >= T.finale) renderFinale(t);
          else renderTower(t);
          grain.style.backgroundImage = `url(${grainTile(5000 + Math.round(t * FPS))})`;
        }
        let last = window.__hfThreeTime || 0;
        window.addEventListener("hf-seek", (e) => { last = e.detail.time; renderAt(last); });
        document.fonts.load('800 80px Archivo').then(() => document.fonts.load('500 60px "JetBrains Mono"')).then(() => renderAt(last));
        logo.onload = () => renderAt(last);
        renderAt(last);
      </script>
    </template>
  </body>
</html>
