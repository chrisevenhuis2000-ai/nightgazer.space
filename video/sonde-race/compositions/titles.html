<!doctype html>
<html lang="nl">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        #t-bug { position: absolute; left: 48px; top: 118px; width: 250px; height: 50px; opacity: 0.85; }

        /* hook */
        #t-hook { position: absolute; left: 64px; right: 64px; top: 190px; }
        #t-hook h1 { font: 800 92px/0.98 var(--sans); letter-spacing: -0.035em; color: var(--pl-ink);
                     text-shadow: 0 6px 40px rgba(4,5,11,0.85); }
        #t-hook h1 span { display: block; }
        #t-hook p { margin-top: 26px; font: 700 46px/1.15 var(--sans); color: var(--pl-stamp); text-shadow: 0 2px 20px rgba(4,5,11,0.95); }
        #t-hook p em { font-style: normal; color: var(--pl-act); }

        /* event captions under the tower */
        .cap { position: absolute; left: 48px; top: 196px; max-width: 900px; display: flex; align-items: center; gap: 20px; opacity: 0;
               padding: 12px 26px 12px 12px; border-radius: 16px; background: rgba(8,10,24,0.86); border: 1px solid rgba(181,212,244,0.18); }
        .cap b { flex: none; font: 500 40px/1 var(--mono); color: var(--pl-act-ink); background: var(--pl-act); padding: 14px 18px 12px; border-radius: 10px; }
        .cap span { font: 700 41px/1.12 var(--sans); color: var(--pl-ink); letter-spacing: -0.01em; text-shadow: 0 2px 18px rgba(4,5,11,0.95); }
        .cap.red b { background: #E5484D; color: #fff; }
        .cap.violet b { background: #8B3DF0; color: #fff; }
        .cap.yellow b { background: #F5D547; color: #14130A; }

        /* the duel */
        #t-duel { position: absolute; left: 40px; right: 40px; top: 210px; opacity: 0; padding: 26px 28px 30px; border-radius: 20px; background: rgba(8,10,24,0.86); border: 1px solid rgba(181,212,244,0.18); }
        #t-duel .d1 { font: 500 64px/1 var(--mono); color: var(--pl-act); }
        #t-duel .d2 { margin-top: 18px; font: 800 74px/1.0 var(--sans); letter-spacing: -0.03em; color: var(--pl-ink); text-shadow: 0 4px 30px rgba(4,5,11,0.9); }

        /* the finish */
        #t-fin { position: absolute; left: 64px; right: 64px; top: 1250px; opacity: 0; }
        #t-fin .f1 { font: 500 56px/1 var(--mono); color: var(--pl-act); }
        #t-fin .f2 { margin-top: 20px; font: 800 70px/1.02 var(--sans); letter-spacing: -0.03em; color: var(--pl-ink); text-shadow: 0 4px 30px rgba(4,5,11,0.9); }
        #t-fin .f3 { margin-top: 22px; font: 600 42px/1.2 var(--sans); color: var(--pl-ink-2); text-shadow: 0 2px 18px rgba(4,5,11,0.95); }

        /* end card */
        #t-end { position: absolute; inset: 0; opacity: 0; }
        #t-end-scrim { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 52%, rgba(14,16,34,0.82), rgba(4,5,11,0.92)); }
        #t-end-logo { position: absolute; left: 190px; top: 760px; width: 700px; height: 140px; }
        #t-end-dom { position: absolute; left: 0; right: 0; top: 950px; text-align: center; font: 800 88px/1 var(--sans); letter-spacing: -0.035em; color: var(--pl-ink); }
        #t-end-cta { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; top: 1100px; white-space: nowrap;
                     height: 100px; padding: 0 48px; display: flex; align-items: center; border-radius: 4px;
                     background: var(--pl-act); color: var(--pl-act-ink); font: 700 44px/1 var(--sans); }
        #t-credit { position: absolute; left: 64px; right: 64px; top: 1290px; text-align: center; font: 500 26px/1.35 var(--sans); color: var(--pl-ink-3); }
      </style>

      <div id="root" data-composition-id="titles" data-width="1080" data-height="1920">
        <img id="t-bug" src="../assets/brand/logo-transparent.png" alt="" width="250" height="50" />

        <div id="t-hook">
          <h1><span id="h1a">Deze race duurt</span><span id="h1b">al 54 jaar.</span></h1>
          <p id="h2">Op <em>18 november</em> valt de finishvlag.</p>
        </div>

        <p class="cap yellow" id="c-launch"><b>1977</b><span>Twee Voyagers vertrekken.</span></p>
        <p class="cap" id="c-pass1"><b>DEC 1977</b><span>Voyager 1 nam een snellere baan.</span></p>
        <p class="cap violet" id="c-jup"><b>1979</b><span>Jupiter slingert Voyager 1 vooruit.</span></p>
        <p class="cap" id="c-pass2"><b>1981</b><span>Pioneer 11 ingehaald.</span></p>
        <p class="cap red" id="c-stil"><b>2003</b><span>Pioneer 10 zendt voor het laatst.</span></p>
        <p class="cap violet" id="c-nh"><b>2006</b><span>New Horizons: snelste start ooit.</span></p>
        <p class="cap" id="c-inter"><b>2012</b><span>Voyager 1 verlaat de bel van de zon.</span></p>

        <div id="t-duel">
          <p class="d1">17 FEB 1998</p>
          <p class="d2">Voyager 1 wordt het verste mensgemaakte object.</p>
        </div>

        <div id="t-fin">
          <p class="f1">18 NOVEMBER 2026</p>
          <p class="f2">Voyager 1 staat 25,9 miljard km van de aarde.</p>
          <p class="f3">Zijn signaal doet er een hele dag over.</p>
        </div>

        <div id="t-end">
          <div id="t-end-scrim"></div>
          <img id="t-end-logo" src="../assets/brand/logo-transparent.png" alt="NightGazer.space" width="700" height="140" />
          <p id="t-end-dom">nightgazer.space</p>
          <div id="t-end-cta">Meer uitleg: link in bio</div>
          <p id="t-credit">Afstanden tot de zon: NASA/JPL Horizons. Pioneer 10 en 11 na contactverlies: berekende baan.</p>
        </div>
      </div>

      <script>
        (function () {
          const T = window.__RACE_T;
          const tl = gsap.timeline({ paused: true });
          const E = "expo.out";
          // hook
          tl.from("#h1a", { y: 60, opacity: 0, duration: 0.5, ease: E }, 0.05);
          tl.from("#h1b", { y: 60, opacity: 0, duration: 0.5, ease: E }, 0.25);
          tl.from("#h2", { y: 30, opacity: 0, duration: 0.45, ease: E }, 1.1);
          tl.to("#t-hook", { y: -40, opacity: 0, duration: 0.35, ease: "power2.in" }, T.launch - 0.35);
          // captions: in on the beat, out before the next
          const cap = (sel, a, b) => {
            tl.fromTo(sel, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: E }, a);
            tl.to(sel, { opacity: 0, x: 30, duration: 0.25, ease: "power2.in" }, b - 0.25);
          };
          cap("#c-launch", T.launch + 0.1, T.pass1 - 0.3);
          cap("#c-pass1", T.pass1 - 0.2, T.jupiter);
          cap("#c-jup", T.jupiter + 0.1, T.pass2 - 0.55);
          cap("#c-pass2", T.pass2 - 0.1, T.duel - 0.4);
          cap("#c-stil", T.stil + 0.1, T.nh);
          cap("#c-nh", T.nh + 0.2, T.inter);
          cap("#c-inter", T.inter + 0.15, T.ffwd2 + 0.4);
          // duel
          tl.fromTo("#t-duel", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.2, ease: E }, T.pass3 + 0.05);
          tl.to("#t-duel", { opacity: 0, duration: 0.25 }, T.back - 0.25);
          // finish
          tl.fromTo("#t-fin .f1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, T.finale + 0.35);
          tl.fromTo("#t-fin .f2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, T.finale + 0.7);
          tl.fromTo("#t-fin .f3", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, T.finale + 1.6);
          tl.set("#t-fin", { opacity: 1 }, T.finale + 0.3);
          tl.to("#t-fin", { opacity: 0, duration: 0.3 }, T.end - 0.1);
          // end card
          tl.to("#t-bug", { opacity: 0, duration: 0.3 }, T.end);
          tl.fromTo("#t-end", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, T.end);
          tl.from("#t-end-logo", { y: 30, opacity: 0, duration: 0.5, ease: E }, T.end + 0.15);
          tl.from("#t-end-dom", { y: 30, opacity: 0, duration: 0.5, ease: E }, T.end + 0.3);
          tl.from("#t-end-cta", { y: 30, opacity: 0, duration: 0.5, ease: E }, T.end + 0.45);
          tl.set({}, {}, T.dur);
          window.__timelines["titles"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
