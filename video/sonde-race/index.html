      // Beat grid in seconds, shared by stage.html and titles.html (and klank/draaiboek.json).
      window.__RACE_T = {
        dur: 30,
        hook: 0.0,        // tower in deep perspective, hook text
        launch: 3.4,      // LANCERING banner: Voyager 2 and 1 enter (1977)
        pass1: 6.3,       // Voyager 1 passes Voyager 2 (Dec 1977)
        jupiter: 7.6,     // ZWAARTEKRACHTSLINGER banner (Jupiter, Mar 1979)
        pass2: 9.3,       // Voyager 1 passes Pioneer 11
        ffwd: 10.2,       // fast-forward to 1998
        duel: 11.6,       // cut into the 3D duel: Voyager 1 vs Pioneer 10
        pass3: 13.4,      // 17 Feb 1998: Voyager 1 takes the lead (drop)
        back: 15.2,       // back to the tower, Voyager 1 on P1
        stil: 16.6,       // SIGNAAL STIL banner (Pioneer 10, Jan 2003)
        nh: 18.6,         // New Horizons, SNELSTE LANCERING (Jan 2006)
        inter: 20.4,      // INTERSTELLAIR banner (Aug 2012)
        ffwd2: 22.6,      // fast-forward to 2026
        finale: 24.2,     // 1 LICHTDAG: checkered flags in the stars (18 Nov 2026)
        end: 27.4,        // end card
      };
      // Story time: seconds → decimal year, piecewise (eased) between keys. The overtakes land on the beats.
      window.__RACE_YEAR = [
        [0.0, 1972.20], [3.0, 1973.60], [3.4, 1977.60], [6.3, 1978.00], [7.6, 1979.18], [9.3, 1981.22],

      ];
