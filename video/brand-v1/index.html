      * { margin: 0; padding: 0; box-sizing: border-box; }

        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0E1022;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0E1022;
        font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
      }

  <body>
    <!--
      Timing (s), 1920x1080, 30 fps, no audio.
      The plate (track 0) is drawn in scene 1 and stays for the whole film;
      scenes 2–6 sit on track 1 and are printed over it.
        1 plaat        0.0 –  4.0   (frame.html)
        2 belofte      4.0 –  9.0
        3 dieptes      9.0 – 18.5
        4 instrument  18.5 – 22.5
        5 logo        22.5 – 26.0
        6 eindkaart   26.0 – 29.5
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29.5"
      data-width="1920"
      data-height="1080"
    >
      <div id="el-frame" class="clip" data-composition-id="frame" data-composition-src="compositions/frame.html"
        data-start="0" data-duration="29.5" data-track-index="0" data-width="1920" data-height="1080"></div>

      <div id="el-belofte" class="clip" data-composition-id="belofte" data-composition-src="compositions/belofte.html"
        data-start="4" data-duration="5" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div id="el-dieptes" class="clip" data-composition-id="dieptes" data-composition-src="compositions/dieptes.html"
        data-start="9" data-duration="9.5" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div id="el-instrument" class="clip" data-composition-id="instrument" data-composition-src="compositions/instrument.html"
        data-start="18.5" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div id="el-logo" class="clip" data-composition-id="logo" data-composition-src="compositions/logo.html"
        data-start="22.5" data-duration="3.5" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div id="el-eindkaart" class="clip" data-composition-id="eindkaart" data-composition-src="compositions/eindkaart.html"
        data-start="26" data-duration="3.5" data-track-index="1" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
