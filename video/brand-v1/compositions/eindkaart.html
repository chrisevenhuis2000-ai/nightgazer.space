<!doctype html>
<html lang="nl">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }

        /* The loupe carries over from the logo plate at reduced strength. */
        #eindkaart-loupe {
          position: absolute;
          left: 360px; top: 190px; width: 1200px; height: 620px;
          background: radial-gradient(50% 50% at 50% 50%, rgba(24,95,165,0.30) 0%, rgba(24,95,165,0) 70%);
          opacity: 0.55;
        }

        #eindkaart-stack {
          position: absolute;
          inset: 0;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 64px;
        }
        #eindkaart-domain {
          font-family: var(--sans);
          font-size: 156px;
          font-weight: 800;
          line-height: 1;
          letter-spacing: -0.032em;
          color: var(--pl-ink);
          padding: 0 0.06em;
        }
        /* The closing call to action: solid cyan, dark ink (10:1), square corners. */
        #eindkaart-cta {
          display: flex; align-items: center; gap: 22px;
          height: 96px;
          padding: 0 52px;
          background: var(--pl-act);
          color: var(--pl-act-ink);
          font-family: var(--sans);
          font-size: 36px;
          font-weight: 700;
          letter-spacing: -0.01em;
          border-radius: 0;
        }
        #eindkaart-cta svg { width: 34px; height: 20px; display: block; }
      </style>

      <div id="root" data-composition-id="eindkaart" data-width="1920" data-height="1080">
        <div id="eindkaart-loupe"></div>
        <div id="eindkaart-stack">
          <p id="eindkaart-domain">nightgazer.space</p>
          <div id="eindkaart-cta">
            <span>Vannacht kijken</span>
            <svg viewBox="0 0 34 20" aria-hidden="true"><path d="M1 10 H31 M23 2.5 L31 10 L23 17.5" fill="none" stroke="#06131A" stroke-width="2.5"/></svg>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const ease = "expo.out";
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#eindkaart-domain", { opacity: 0, filter: "blur(8px)" },
                    { opacity: 1, filter: "blur(0px)", duration: 0.7, ease }, 0.1);
          tl.fromTo("#eindkaart-cta", { clipPath: "inset(0 100% 0 0)" },
                    { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "power3.inOut" }, 0.4);
          // Everything is still from 1.0s to the end (3.5s): the poster frame lives here.

          tl.set({}, {}, 3.5);
          window.__timelines["eindkaart"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
