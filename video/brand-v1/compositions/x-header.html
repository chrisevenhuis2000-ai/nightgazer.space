      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1500px; height: 500px; overflow: hidden; background: #0E1022; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        background: #0E1022;
        font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
      }
      #xh-card { position: absolute; inset: 0; }

      /* The plate: emulsion field, ruled grid, 1px edge. */
      #xh-plate {
        position: absolute; left: 20px; top: 20px; width: 1460px; height: 460px;
        background-color: #15182F;
        background-image:
          repeating-linear-gradient(90deg, rgba(39,44,80,0.40) 0 1px, transparent 1px 36px),
          repeating-linear-gradient(0deg,  rgba(39,44,80,0.26) 0 1px, transparent 1px 36px);
        background-position: 18px 18px;
        border: 1px solid #272C50;
      }
      /* The light-box loupe under the asterism. */
      #xh-loupe {
        position: absolute; left: 140px; top: -30px; width: 680px; height: 470px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(24,95,165,0.32) 0%, rgba(24,95,165,0) 70%);
      }
      #xh-loupe-2 {
        position: absolute; left: 880px; top: 60px; width: 640px; height: 380px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(24,95,165,0.16) 0%, rgba(24,95,165,0) 70%);
      }
      #xh-lines { position: absolute; inset: 0; width: 1500px; height: 500px; }

      /* Right-hand envelope block. Clear of the avatar (bottom-left) and of mobile top/bottom crop. */
      #xh-text {
        position: absolute; right: 90px; top: 128px; width: 600px;
        display: flex; flex-direction: column; align-items: flex-end; text-align: right;
      }
      .xh-label {
        font-size: 15px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
        color: #B5D4F4; line-height: 1; white-space: nowrap;
      }
      #xh-rule { width: 100%; height: 1px; background: #272C50; margin: 20px 0 22px; }
      #xh-title {
        font-size: 74px; font-weight: 800; line-height: 0.98; letter-spacing: -0.034em;
        color: #EEF2FB; text-wrap: balance;
      }
      #xh-sub {
        margin-top: 20px; font-size: 26px; font-weight: 500; line-height: 1.25;
        letter-spacing: -0.01em; color: #9AA6C8;
      }
      #xh-meta { margin-top: 24px; color: #868EB4; }
      .xh-mono { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
      .xh-star-name { font-family: "JetBrains Mono", monospace; font-size: 13px; fill: #868EB4; }
      #xh-caption { position: absolute; left: 252px; top: 334px; font-size: 13px; color: #868EB4; }
    </style>
  </head>
  <body>
    <!-- Static 1500x500 still for the X profile header. The avatar covers the bottom-left
         (~x 40-380, y 300-500) on desktop and mobile crops top and bottom, so nothing
         readable sits there. No live values, so no chinagraph blue; no CTA.
         Export: npx hyperframes render -c compositions/x-header.html --format png-sequence -o out/x-header -->
    <div id="root" data-composition-id="x-header" data-start="0" data-duration="1" data-width="1500" data-height="500">
      <div id="xh-card" class="clip" data-start="0" data-duration="1" data-track-index="0">
        <div id="xh-plate"></div>
        <div id="xh-loupe"></div>
        <div id="xh-loupe-2"></div>
        <svg id="xh-lines" viewBox="0 0 1500 500" aria-hidden="true">
          <g id="xh-grain"></g>
          <!-- Corner registration marks, as on .pl-plate. -->
          <polyline points="28.5,46.5 28.5,28.5 46.5,28.5" fill="none" stroke="#B5D4F4" stroke-opacity="0.5" stroke-width="1" />
          <polyline points="1471.5,453.5 1471.5,471.5 1453.5,471.5" fill="none" stroke="#B5D4F4" stroke-opacity="0.5" stroke-width="1" />
          <g id="xh-ruler-top" stroke="#185FA5" stroke-width="1"></g>
          <g id="xh-ruler-right" stroke="#185FA5" stroke-width="1"></g>
          <g id="xh-asterism"></g>
        </svg>
        <div id="xh-text">
          <p class="xh-label">Plaat X-001 &middot; nightgazer.space</p>
          <div id="xh-rule"></div>
          <p id="xh-title">Astronomie voor Iedereen</p>
          <p id="xh-sub">Elke nacht: wat je vanuit Nederland kunt zien.</p>
          <p id="xh-meta" class="xh-label">Nieuws &middot; Sterrenkijken &middot; Uitleg op jouw niveau</p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const NS = "http://www.w3.org/2000/svg";
        const el = (tag, attrs, parent) => {
          const n = document.createElementNS(NS, tag);
          for (const k in attrs) n.setAttribute(k, attrs[k]);
          parent.appendChild(n);
          return n;
        };

        // Edge fiducial rulers: a tick every 10px, a long tick every 10th. Deterministic.
        // Top and right only; the left edge belongs to the avatar.
        const top = document.getElementById("xh-ruler-top");
        for (let i = 0, x = 560.5; x < 1436; i++, x += 10)
          el("line", { x1: x, x2: x, y1: 21, y2: i % 10 === 0 ? 33 : 27 }, top);
        const right = document.getElementById("xh-ruler-right");
        for (let i = 0, y = 60.5; y < 300; i++, y += 10)
          el("line", { y1: y, y2: y, x1: 1479, x2: i % 10 === 0 ? 1467 : 1473 }, right);

        // Silver grains: seeded, so every render is identical.
        let s = 20261023;
        const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
        const grain = document.getElementById("xh-grain");
        for (let i = 0; i < 260; i++) {
          const x = 24 + rnd() * 1452, y = 24 + rnd() * 452;
          const big = rnd() > 0.93;
          el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: big ? 1.3 : 0.7,
                         fill: "#B5D4F4", "fill-opacity": (big ? 0.55 : 0.22 + rnd() * 0.25).toFixed(2) }, grain);
        }

        // De Grote Beer (Steelpannetje), plotted from real J2000 positions.
        // Sky view: east is left, so x runs against right ascension.
        const stars = [
          ["Dubhe",  11.062, 61.75, 1.8], ["Merak",  11.031, 56.38, 2.4],
          ["Phecda", 11.897, 53.69, 2.4], ["Megrez", 12.257, 57.03, 3.3],
          ["Alioth", 12.900, 55.96, 1.8], ["Mizar",  13.399, 54.93, 2.2],
          ["Alkaid", 13.792, 49.31, 1.9],
        ];
        // The pan is circumpolar and turns through the night; this is its orientation
        // late on an autumn evening, rotated so the handle stays clear of the avatar.
        const dec0 = 55.5 * Math.PI / 180;
        const sc = 21; // px per degree
        const rot = 15 * Math.PI / 180;
        const raw = stars.map(([n, ra, de, m]) => ({
          n, m, x: -(ra - 12.4) * 15 * Math.cos(dec0) * sc, y: -(de - 55.5) * sc,
        }));
        const cx = 480, cy = 195;
        const P = raw.map(p => ({
          n: p.n, m: p.m,
          x: cx + p.x * Math.cos(rot) - p.y * Math.sin(rot),
          y: cy + p.x * Math.sin(rot) + p.y * Math.cos(rot),
        }));
        const ast = document.getElementById("xh-asterism");
        const path = [0, 1, 2, 3, 0, 3, 4, 5, 6].map(i => `${P[i].x.toFixed(1)},${P[i].y.toFixed(1)}`).join(" ");
        el("polyline", { points: path, fill: "none", stroke: "#B5D4F4", "stroke-opacity": 0.38, "stroke-width": 1 }, ast);
        for (const p of P) {
          const r = 7.5 - p.m * 1.4;
          el("circle", { cx: p.x, cy: p.y, r: r * 3.2, fill: "#185FA5", "fill-opacity": 0.22 }, ast);
          el("circle", { cx: p.x, cy: p.y, r: r, fill: "#EEF2FB" }, ast);
        }
        // Archivist's marks: a reticle on Dubhe, names on the two ends of the pan.
        const d = P[0];
        el("circle", { cx: d.x, cy: d.y, r: 16, fill: "none", stroke: "#B5D4F4", "stroke-opacity": 0.55, "stroke-width": 1 }, ast);
        for (const [dx, dy, ex, ey] of [[-26,0,-19,0],[26,0,19,0],[0,-26,0,-19],[0,26,0,19]])
          el("line", { x1: d.x + dx, y1: d.y + dy, x2: d.x + ex, y2: d.y + ey, stroke: "#B5D4F4", "stroke-opacity": 0.55 }, ast);
        const label = (p, txt, dx, dy, anchor) => {
          const t = el("text", { x: p.x + dx, y: p.y + dy, "text-anchor": anchor, class: "xh-star-name" }, ast);
          t.textContent = txt;
        };
        label(P[0], "α UMa  Dubhe", 30, 5, "start");
        label(P[6], "η UMa  Alkaid", 0, 28, "middle");

        const tl = gsap.timeline({ paused: true });
        tl.set({}, {}, 1);
        window.__timelines["x-header"] = tl;
      })();
    </script>
  </body>
