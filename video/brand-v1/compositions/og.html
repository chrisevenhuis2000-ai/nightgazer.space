      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #0E1022; }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0E1022;
        font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
      }
      #og-card { position: absolute; inset: 0; }

      /* The plate: emulsion field, ruled grid, 1px edge. */
      #og-plate {
        position: absolute;
        left: 24px; top: 24px; width: 1152px; height: 582px;
        background-color: #15182F;
        background-image:
          repeating-linear-gradient(90deg, rgba(39,44,80,0.40) 0 1px, transparent 1px 36px),
          repeating-linear-gradient(0deg,  rgba(39,44,80,0.26) 0 1px, transparent 1px 36px);
        background-position: 18px 18px;
        border: 1px solid #272C50;
      }
      #og-lines { position: absolute; inset: 0; width: 1200px; height: 630px; }

      /* The light-box loupe under the mark. */
      #og-loupe {
        position: absolute;
        left: 200px; top: 70px; width: 800px; height: 490px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(24,95,165,0.30) 0%, rgba(24,95,165,0) 70%);
      }

      #og-stack {
        position: absolute;
        inset: 24px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      /* Native size (500x100), never scaled. */
      #og-logo { display: block; width: 500px; height: 100px; }
      #og-rule { width: 420px; height: 1px; background: #272C50; margin: 34px 0 30px; }
      #og-domain {
        font-family: "Archivo", sans-serif;
        font-size: 92px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.032em;
        color: #EEF2FB;
        padding: 0 0.06em;
      }
      #og-tagline {
        margin-top: 22px;
        font-family: "Archivo", sans-serif;
        font-size: 38px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: #9AA6C8;

  <body>
    <!-- Static 1200x630 still for public/og-image.png. No CTA: an OG image is not clickable.
         Export: npx hyperframes render -c compositions/og.html --format png-sequence -o out/og -->
    <div id="root" data-composition-id="og" data-start="0" data-duration="1" data-width="1200" data-height="630">
      <div id="og-card" class="clip" data-start="0" data-duration="1" data-track-index="0">
        <div id="og-plate"></div>
        <div id="og-loupe"></div>
        <svg id="og-lines" viewBox="0 0 1200 630" aria-hidden="true">
          <!-- Corner registration marks, as on .pl-plate. -->
          <polyline points="32.5,50.5 32.5,32.5 50.5,32.5" fill="none" stroke="#B5D4F4" stroke-opacity="0.5" stroke-width="1" />
          <polyline points="1167.5,579.5 1167.5,597.5 1149.5,597.5" fill="none" stroke="#B5D4F4" stroke-opacity="0.5" stroke-width="1" />
          <g id="og-ruler-top" stroke="#185FA5" stroke-width="1"></g>
          <g id="og-ruler-left" stroke="#185FA5" stroke-width="1"></g>
        </svg>
        <div id="og-stack">
          <img id="og-logo" src="../assets/brand/logo-transparent.png" alt="NightGazer.space" width="500" height="100" />
          <div id="og-rule"></div>
          <p id="og-domain">nightgazer.space</p>
          <p id="og-tagline">Astronomie voor Iedereen</p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        // Edge fiducial rulers: a tick every 10px, a long tick every 10th. Deterministic.
        const NS = "http://www.w3.org/2000/svg";
        const top = document.getElementById("og-ruler-top");
        for (let i = 0, x = 64.5; x < 1136; i++, x += 10) {
          const l = document.createElementNS(NS, "line");
          l.setAttribute("x1", x); l.setAttribute("x2", x);
          l.setAttribute("y1", 25); l.setAttribute("y2", i % 10 === 0 ? 37 : 31);
          top.appendChild(l);
        }
        const left = document.getElementById("og-ruler-left");
        for (let i = 0, y = 64.5; y < 566; i++, y += 10) {
          const l = document.createElementNS(NS, "line");
          l.setAttribute("y1", y); l.setAttribute("y2", y);
          l.setAttribute("x1", 25); l.setAttribute("x2", i % 10 === 0 ? 37 : 31);
          left.appendChild(l);
        }
        const tl = gsap.timeline({ paused: true });
        tl.set({}, {}, 1);
        window.__timelines["og"] = tl;
      })();
    </script>
