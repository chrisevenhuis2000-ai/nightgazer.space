<!doctype html>
<html lang="nl">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        #titles-scrim { position: absolute; left: 0; top: 0; bottom: 0; width: 1180px;
                        background: linear-gradient(90deg, rgba(5,6,13,0.78) 0%, rgba(5,6,13,0.55) 52%, rgba(5,6,13,0) 100%); }
        .t-block { position: absolute; left: 150px; width: 1500px; }
        .t-line { font: 800 104px/1.0 var(--sans); letter-spacing: -0.035em; color: var(--pl-ink); text-shadow: 0 4px 40px rgba(5,6,13,0.6); }
        .t-line span { display: block; padding-right: 0.06em; white-space: nowrap; }
        .t-mid { font-size: 76px; }
        .t-sub { margin-top: 30px; font: 500 38px/1.3 var(--sans); color: var(--pl-ink-2); white-space: nowrap; text-shadow: 0 2px 18px rgba(5,6,13,0.9); }
        #titles-wipe { position: absolute; left: 150px; top: 380px; width: 1px; height: 240px; background: var(--pl-stamp); opacity: 0; }

        /* 1 — hook and the three things that happen overhead */
        #t-hook { top: 330px; }
        #t-chips { position: absolute; left: 150px; top: 640px; display: flex; gap: 18px; }
        .chip { display: flex; align-items: center; gap: 16px; height: 76px; padding: 0 32px; border: 1px solid rgba(181,212,244,0.45);
                background: rgba(14,16,34,0.72); font: 600 36px/1 var(--sans); color: var(--pl-ink); white-space: nowrap; }
        .chip b { width: 12px; height: 12px; border-radius: 50%; background: var(--pl-act); box-shadow: 0 0 14px var(--pl-act); }

        /* 2 — the site */
        #t-site { top: 150px; }
        #t-toast { position: absolute; right: 120px; top: 120px; width: 600px; padding: 26px 30px; display: flex; gap: 24px;
                   background: rgba(21,24,47,0.94); border: 1px solid rgba(181,212,244,0.35); border-radius: 22px;
                   box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(55,138,221,0.15); }
        #t-toast .ic { flex: none; width: 72px; height: 72px; border-radius: 16px; background: #0E1022; display: grid; place-items: center; border: 1px solid var(--pl-rule); }
        #t-toast .tx { flex: 1; }
        #t-toast .app { font: 600 20px/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--pl-ink-3); display: flex; justify-content: space-between; }
        #t-toast .ti { margin-top: 12px; font: 700 32px/1.1 var(--sans); color: var(--pl-ink); }
        #t-toast .bo { margin-top: 8px; font: 500 25px/1.3 var(--sans); color: var(--pl-ink-2); }
        #t-feats { position: absolute; left: 150px; bottom: 150px; }
        #t-feats p { font: 700 54px/1.1 var(--sans); letter-spacing: -0.02em; color: var(--pl-ink); white-space: nowrap; text-shadow: 0 2px 24px rgba(5,6,13,0.9); }
        #t-feats p + p { margin-top: 12px; }
        #t-feats em { font-style: normal; color: var(--pl-stamp); }

        /* 3 — the maker */
        #t-maker { top: 300px; }

        /* 4 — coffee */
        #t-cup { position: absolute; left: 330px; top: 170px; width: 520px; height: 720px; }
        #t-coffee { position: absolute; left: 960px; top: 360px; }
        #t-coffee .t-line { font-size: 92px; }

        /* 5 — sign-off */
        #titles-end { position: absolute; inset: 0; }
        #titles-logo { position: absolute; left: 710px; top: 250px; width: 500px; height: 100px; }
        #titles-domain { position: absolute; left: 0; right: 0; top: 400px; text-align: center;
                         font: 800 104px/1 var(--sans); letter-spacing: -0.035em; color: var(--pl-ink); }
        #titles-cta { position: absolute; left: 50%; top: 590px; transform: translateX(-50%);
                      height: 116px; padding: 0 56px 0 44px; display: flex; align-items: center; gap: 22px; white-space: nowrap;
                      background: var(--pl-act); color: var(--pl-act-ink); font: 700 48px/1 var(--sans); letter-spacing: -0.01em; }
        #titles-cta svg { width: 54px; height: 54px; display: block; }
        #titles-sub { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font: 500 34px/1.3 var(--sans); color: var(--pl-ink-2); }
        #titles-kofi { position: absolute; left: 0; right: 0; top: 820px; text-align: center; font-size: 28px; color: var(--pl-ink-3); }

        .t-credit { position: absolute; right: 64px; bottom: 40px; font: 500 17px/1 var(--sans); letter-spacing: 0.02em;
                    color: var(--pl-ink-2); white-space: nowrap; text-shadow: 0 1px 6px rgba(5,6,13,0.95), 0 0 2px rgba(5,6,13,0.95); }
      </style>

      <div id="root" data-composition-id="titles" data-width="1920" data-height="1080">
        <div id="titles-scrim"></div>

        <!-- 1 -->
        <h1 id="t-hook" class="t-block t-line"><span>Elke nacht gebeurt er</span><span>iets boven je dak.</span></h1>
        <i id="titles-wipe"></i>
        <div id="t-chips">
          <span class="chip" id="chip1"><b></b>ISS-overkomst</span>
          <span class="chip" id="chip2"><b></b>Noorderlicht</span>
          <span class="chip" id="chip3"><b></b>Heldere, donkere nacht</span>
        </div>

        <!-- 2 -->
        <h2 id="t-site" class="t-block t-line t-mid"><span id="t-site-1">Wanneer en waar</span><span id="t-site-2">je moet kijken.</span></h2>
        <div id="t-toast">
          <div class="ic"><span style="display:block;width:62px;height:52px;overflow:hidden"><img src="../assets/brand/logo-transparent.png" alt="" width="260" height="52" style="display:block;width:260px;height:52px;max-width:none" /></span></div>
          <div class="tx">
            <p class="app"><span>NightGazer</span><span>nu</span></p>
            <p class="ti">Heldere, donkere nacht</p>
            <p class="bo">Weinig bewolking én een maan die niet in de weg staat, bij jou in de buurt.</p>
          </div>
        </div>
        <div id="t-feats">
          <p id="feat1">Ruimtenieuws, <em>in gewoon Nederlands</em></p>
          <p id="feat2">Lessen, <em>voor wie meer wil weten</em></p>
        </div>

        <!-- 3 -->
        <div id="t-maker" class="t-block">
          <h2 class="t-line"><span id="mk1">Eén maker.</span><span id="mk2">Vrije tijd.</span></h2>
          <p class="t-sub" id="mk3">Zonder betaalmuur, voor iedereen die omhoog kijkt.</p>
        </div>

        <!-- 4 -->
        <svg id="t-cup" viewBox="0 0 520 720" aria-hidden="true">
          <defs>
            <linearGradient id="cupBody" x1="0" x2="1"><stop offset="0" stop-color="#1A1D38"/><stop offset="0.55" stop-color="#272C50"/><stop offset="1" stop-color="#15182F"/></linearGradient>
            <radialGradient id="foam" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E9D9C4"/><stop offset="0.75" stop-color="#C9A37E"/><stop offset="1" stop-color="#8A5E3B"/></radialGradient>
            <radialGradient id="glowCup" cx="0.5" cy="0.6" r="0.5"><stop offset="0" stop-color="rgba(61,207,223,0.30)"/><stop offset="1" stop-color="rgba(61,207,223,0)"/></radialGradient>
          </defs>
          <ellipse cx="260" cy="560" rx="250" ry="120" fill="url(#glowCup)"/>
          <!-- steam: three strands that draw upward and curl into stars -->
          <g id="steam" fill="none" stroke="#B5D4F4" stroke-width="7" stroke-linecap="round" opacity="0.8">
            <path id="st1" d="M200 330 C170 280 240 250 205 195 C175 150 225 120 210 80" />
            <path id="st2" d="M262 320 C292 268 225 236 262 180 C292 132 238 98 260 50" />
            <path id="st3" d="M322 330 C352 282 290 252 322 200 C350 158 305 128 318 92" />
          </g>
          <g id="sparks" fill="#EEF2FB">
            <path id="sp1" d="M210 70 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
            <path id="sp2" d="M260 38 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
            <path id="sp3" d="M318 84 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z"/>
          </g>
          <!-- saucer, cup, handle -->
          <ellipse cx="260" cy="610" rx="230" ry="44" fill="#15182F" stroke="#3a4170" stroke-width="2"/>
          <ellipse cx="260" cy="600" rx="150" ry="22" fill="#0E1022"/>
          <path d="M392 420 C470 420 470 530 380 530" fill="none" stroke="#272C50" stroke-width="26" stroke-linecap="round"/>
          <path d="M110 380 L130 560 C135 590 385 590 390 560 L410 380 Z" fill="url(#cupBody)" stroke="#3a4170" stroke-width="2"/>
          <ellipse cx="260" cy="380" rx="150" ry="38" fill="#2e3460"/>
          <ellipse cx="260" cy="384" rx="136" ry="30" fill="url(#foam)"/>
          <!-- latte art: a crescent moon in the foam -->
          <path id="moon" d="M282 366 a20 20 0 1 0 0 36 a16 16 0 1 1 0 -36z" fill="#FBF3E6" opacity="0.95"/>
          <text x="260" y="500" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="30" letter-spacing="4" fill="#9AA6C8">NIGHTGAZER</text>
        </svg>
        <div id="t-coffee" class="t-block" style="left:960px; width:900px">
          <h2 class="t-line"><span id="cf1">Trakteer me</span><span id="cf2">op een koffie.</span></h2>
          <p class="t-sub" id="cf3">Zo help je NightGazer in de lucht te houden.</p>
        </div>

        <!-- 5 -->
        <div id="titles-end">
          <img id="titles-logo" src="../assets/brand/logo-transparent.png" alt="NightGazer.space" width="500" height="100" />
          <p id="titles-domain">nightgazer.space</p>
          <div id="titles-cta">
            <svg viewBox="0 0 54 54" aria-hidden="true"><path d="M10 20 h28 l-3 22 c-1 5 -21 5 -22 0z" fill="none" stroke="#06131A" stroke-width="3.5" stroke-linejoin="round"/><path d="M38 24 c9 0 9 12 -1 12" fill="none" stroke="#06131A" stroke-width="3.5"/><path id="cta-steam" d="M19 15 c-3 -4 3 -6 0 -10 M27 15 c-3 -4 3 -6 0 -10" fill="none" stroke="#06131A" stroke-width="3" stroke-linecap="round"/></svg>
            <span>Trakteer op een koffie</span>
          </div>
          <p id="titles-sub">Zet je meldingen aan en kijk vanavond omhoog.</p>
          <p id="titles-kofi" class="ng-num">ko-fi.com/nightgazerspace</p>
        </div>

        <p class="t-credit" id="credit-earth">Aarde: NASA Earth Observatory (Black Marble 2016)</p>
        <p class="t-credit" id="credit-m74">M74: ESA/Webb, NASA &amp; CSA, J. Lee and the PHANGS-JWST Team; ESA/Hubble &amp; NASA, R. Chandar</p>
      </div>

      <script>
        (function () {
          const T = window.__KOFI_T;
          const tl = gsap.timeline({ paused: true });
          const reveal = (sel, at, dur = 0.26) =>
            tl.fromTo(sel, { clipPath: "inset(-10% 105% -10% 0%)" }, { clipPath: "inset(-10% -5% -10% 0%)", duration: dur, ease: "power3.out" }, at);
          const out = (sel, at, dur = 0.24) => tl.to(sel, { opacity: 0, filter: "blur(6px)", duration: dur, ease: "power1.in" }, at);
          const rise = (sel, at, dur = 0.5, y = 18) => tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: dur, ease: "expo.out" }, at);
          const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.86, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(2.2)" }, at);

          gsap.set(["#t-chips .chip", "#t-site", "#t-toast", "#t-feats p", "#t-maker", "#t-cup", "#t-coffee", "#titles-end", "#credit-m74"], { opacity: 0 });

          // 1 — hook on the poster frame; swept off at r2, chips on the spoken words.
          tl.set("#titles-wipe", { opacity: 1 }, T.r2 - 0.25);
          tl.fromTo("#titles-wipe", { x: 0, y: -40 }, { x: 1100, duration: 0.22, ease: "power2.in", immediateRender: false }, T.r2 - 0.25);
          tl.fromTo("#t-hook", { clipPath: "inset(-10% -5% -10% 0%)" },
                    { clipPath: "inset(-10% -5% -10% 105%)", duration: 0.22, ease: "power2.in", immediateRender: false }, T.r2 - 0.25);
          tl.set("#titles-wipe", { opacity: 0 }, T.r2);
          tl.to("#t-chips", { y: -260, duration: 0.01 }, T.r2 - 0.01);
          pop("#chip1", T.r2 + 0.1);
          pop("#chip2", T.r2 + 1.25);
          pop("#chip3", T.r2 + 2.35);
          out("#t-chips", T.screens - 0.35, 0.3);
          tl.to("#credit-earth", { opacity: 0, duration: 0.2 }, T.screens - 0.3);

          // 2 — the site
          tl.set("#t-site", { opacity: 1 }, T.r3);
          reveal("#t-site-1", T.r3 + 0.2);
          reveal("#t-site-2", T.r3 + 0.7);
          out("#t-site", T.r4 - 0.3, 0.25);
          tl.fromTo("#t-toast", { opacity: 0, x: 80, scale: 0.96 }, { opacity: 1, x: 0, scale: 1, duration: 0.6, ease: "expo.out" }, T.toast);
          tl.to("#t-toast", { opacity: 0, x: 60, duration: 0.35, ease: "power2.in" }, T.r4 + 2.2);
          rise("#feat1", T.r4 + 0.15, 0.55, 24);
          rise("#feat2", T.r4 + 2.1, 0.55, 24);
          out("#t-feats p", T.galaxy - 0.4, 0.3);

          // 3 — the maker, on the turning galaxy
          tl.set("#t-maker", { opacity: 1 }, T.r5);
          reveal("#mk1", T.r5 + 0.1);
          reveal("#mk2", T.r5 + 1.6);
          rise("#mk3", T.r5 + 3.3, 0.6);
          out("#t-maker", T.coffee - 0.4, 0.3);
          tl.to("#titles-scrim", { opacity: 0, duration: 0.6 }, T.coffee - 0.4);
          tl.to("#credit-m74", { opacity: 1, duration: 0.6 }, T.galaxy + 0.6);

          // 4 — coffee: the cup lands, the steam draws itself upward and ends in three little stars.
          tl.fromTo("#t-cup", { opacity: 0, y: 60, rotation: -3 }, { opacity: 1, y: 0, rotation: 0, duration: 0.8, ease: "expo.out" }, T.coffee);
          ["#st1", "#st2", "#st3"].forEach((s, i) => {
            tl.fromTo(s, { strokeDasharray: 400, strokeDashoffset: 400 }, { strokeDashoffset: 0, duration: 1.6, ease: "sine.inOut" }, T.coffee + 0.6 + i * 0.25);
            tl.to(s, { y: -18, opacity: 0.35, duration: 3.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, T.coffee + 2.0 + i * 0.25);
          });
          ["#sp1", "#sp2", "#sp3"].forEach((s, i) => {
            tl.fromTo(s, { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(3)" }, T.coffee + 2.0 + i * 0.25);
            tl.to(s, { y: -30, rotation: 90, opacity: 0.6, duration: 3.5, ease: "sine.out" }, T.coffee + 2.5 + i * 0.25);
          });
          tl.fromTo("#moon", { scale: 0.6, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 0.95, duration: 0.8, ease: "back.out(2)" }, T.coffee + 0.5);
          tl.set("#t-coffee", { opacity: 1 }, T.r6);
          reveal("#cf1", T.r6 + 1.9);
          reveal("#cf2", T.r6 + 2.3);
          rise("#cf3", T.r6 + 3.6, 0.6);
          out(["#t-cup", "#t-coffee"], T.end - 0.35, 0.3);

          // 5 — sign-off; still from T.still. The CTA cup keeps a single breath of steam.
          tl.set("#titles-end", { opacity: 1 }, T.end);
          tl.fromTo("#titles-logo", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, T.end);
          tl.fromTo("#titles-domain", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, T.end + 0.2);
          tl.fromTo("#titles-cta", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "power3.inOut" }, T.end + 0.6);
          tl.fromTo("#cta-steam", { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.8, ease: "sine.out" }, T.end + 1.0);
          rise("#titles-sub", T.r7 + 1.2, 0.6);
          tl.fromTo("#titles-kofi", { opacity: 0 }, { opacity: 1, duration: 0.5 }, T.r7 + 1.6);

          tl.set({}, {}, T.dur);
          window.__timelines["titles"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
