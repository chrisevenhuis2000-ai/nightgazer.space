                vGloed.userData.set({ alpha: 0.9 * clamp01((afst - 20) / 25) });  // van ver: een felle stip
                const zonA = venster(t, L(2, 0.2), L(4, 0.2), 0.6, 0.6) * clamp01(((camRef ? camRef.position.length() : 8) - 26) / 40);
