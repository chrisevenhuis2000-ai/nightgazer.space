      labels:
        haak1: Deze satelliet kijkt
        haak2: dwars door wolken heen
        raket: Electron
        satelliet: Radarsatelliet
        puls: Radarpuls
        echo: Echo
        baan: "Lage baan: 2.000 km of lager"
      feiten:
        - waarde: 2.000 km
          citaat: Low Earth orbit encompasses Earth-centered orbits with an altitude of 1,200 miles (2,000 km) or less.
