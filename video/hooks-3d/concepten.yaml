                stralen.children.forEach((l, i) => l.userData.set({ kop: smooth((t - L(4, 0.45) - i * 0.07) / 2.0), len: 0.35, alpha: venster(t, L(4, 0), L(5, 0.7), 0.3, 0.5) }));
