            const puls = gloed("#E8FBFF", { grootte: 1, scherp: 6, alpha: 0 }); scene.add(puls);
            const vertrek = VAR === "A" ? L(1, 0.4) : L(0, 0.5), aankomst = L(7, 0.6);
